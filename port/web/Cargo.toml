[package]
name = "pp_web"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The host: the Bevy app that owns the window (in a browser, the canvas),
# reads the input and draws what the core returns (docs/DESIGN.md, "The
# parts"). Bevy's features are cut to the window, rendering, sprites, PNG
# and WebGL2; nothing else is compiled in.
[dependencies]
pp_core = { path = "../core" }
# The loader script (port/www/index.html) hands the start pack and the
# address's settings to the game through `window.ppConfig`; these two read it.
js-sys = "0.3"
wasm-bindgen = "0.2"

[dependencies.bevy]
version = "=0.20.0"
default-features = false
features = [
    "std",
    "async_executor",
    "bevy_log",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "png",
    "webgl2",
    "web",
]
