[package]
name = "pp_core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The game core knows nothing of Bevy or the browser (docs/DESIGN.md, "The
# parts"). It reads PNG pictures itself so that the same pack loads the same
# way in the browser and in `cargo test`; `png` is plain Rust and is already
# part of the build through Bevy.
[dependencies]
png = "0.18"
