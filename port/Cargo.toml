[workspace]
resolver = "3"
members = ["core", "web"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# The browser build is a download, so it is tuned for size first. Measured
# sizes are in docs/milestone-0.md.
[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
debug = false
strip = "debuginfo"
